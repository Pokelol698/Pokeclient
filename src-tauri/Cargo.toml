[package]
name = "poke-client"
version = "0.1.0"
description = "Poke Client Minecraft Launcher"
authors = ["Poke Client"]
edition = "2021"
license = "MIT"

[lib]
name = "poke_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2.12.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
